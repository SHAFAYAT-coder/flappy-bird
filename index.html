
<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>
<style>
body {
  margin: 0;
  background: #70c5ce;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial;
}
canvas {
  background: #70c5ce;
  border: 3px solid white;
}
</style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird = {
  x: 80,
  y: 250,
  velocity: 0,
  gravity: 0.5,
  jump: -8,
  size: 15
};

let pipes = [];
let score = 0;
let gameOver = false;
let started = false;

function addPipe() {
  let top = Math.random() * 250 + 50;
  pipes.push({
    x: 400,
    top: top,
    bottom: top + 150,
    passed: false
  });
}

function drawBird() {
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "orange";
  ctx.fillRect(bird.x + 10, bird.y, 15, 8);
}

function drawPipes() {
  ctx.fillStyle = "green";

  pipes.forEach(pipe => {
    ctx.fillRect(pipe.x, 0, 50, pipe.top);
    ctx.fillRect(pipe.x, pipe.bottom, 50, 600 - pipe.bottom);
  });
}

function update() {
  if (!started || gameOver) return;

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  pipes.forEach(pipe => {
    pipe.x -= 2;

    if (!pipe.passed && pipe.x + 50 < bird.x) {
      score++;
      pipe.passed = true;
    }

    if (
      bird.x + bird.size > pipe.x &&
      bird.x - bird.size < pipe.x + 50 &&
      (bird.y - bird.size < pipe.top ||
       bird.y + bird.size > pipe.bottom)
    ) {
      gameOver = true;
    }
  });

  pipes = pipes.filter(pipe => pipe.x > -50);

  if (pipes.length === 0 || pipes[pipes.length - 1].x < 220) {
    addPipe();
  }

  if (bird.y > 585 || bird.y < 0) {
    gameOver = true;
  }
}

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  drawPipes();
  drawBird();

  ctx.fillStyle = "white";
  ctx.font = "30px Arial";
  ctx.fillText("Score: " + score, 15, 40);

  if (!started) {
    ctx.font = "24px Arial";
    ctx.fillText("FLAPPY BIRD", 110, 250);
    ctx.font = "17px Arial";
    ctx.fillText("Press SPACE to Start", 110, 290);
  }

  if (gameOver) {
    ctx.fillStyle = "red";
    ctx.font = "40px Arial";
    ctx.fillText("GAME OVER", 85, 270);

    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Press SPACE to Restart", 90, 320);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function flap() {
  if (gameOver) {
    bird.y = 250;
    bird.velocity = 0;
    pipes = [];
    score = 0;
    gameOver = false;
    started = true;
    return;
  }

  started = true;
  bird.velocity = bird.jump;
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") flap();
});

canvas.addEventListener("click", flap);

loop();
</script>

</body>
</html>
